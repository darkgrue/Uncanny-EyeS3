build_flags =
	-Wall
	-D ARDUINO_LILYGO_T_RGB
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D BOARD_HAS_PSRAM
	-D ARDUINO_RUNNING_CORE=1
	-D ARDUINO_EVENT_RUNNING_CORE=1
	-Isrc
	-Isrc/common
	-Isrc/eyes
	-Isrc/eye
	-Isrc/animation
	-Isrc/display
	-Isrc/input
	-Isrc/network
	-Isrc/config
	-Isrc/user
monitor_echo = yes
monitor_eol = LF
monitor_filters =
	direct
	esp32_exception_decoder
	send_on_enter
monitor_speed = 115200
upload_speed = 921600
build_type = debug
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
